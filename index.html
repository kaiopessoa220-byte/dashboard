<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuvant Performance</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: rgba(255,255,255,0.06);
    --accent: #c8f04a;
    --accent2: #a8d638;
    --text: #f0ede8;
    --muted: #7a7880;
    --danger: #ff5f5f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background noise texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* Radial glow */
  body::after {
    content: '';
    position: fixed;
    top: -20%;
    left: -10%;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle, rgba(200,240,74,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 40px;
  }

  /* Header */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 56px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .logo-block {}

  .logo-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 42px;
    font-weight: 400;
    line-height: 1;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  /* Status pill */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.02em;
    transition: all 0.3s;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }

  .status-pill.ok .status-dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .status-pill.ok { color: var(--text); }
  .status-pill.err .status-dot { background: var(--danger); }
  .status-pill.err { color: var(--danger); }

  /* Cards grid */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.25s, transform 0.2s;
    animation: fadeUp 0.5s both;
  }

  .card:hover {
    border-color: rgba(200,240,74,0.2);
    transform: translateY(-2px);
  }

  /* Accent line on top */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 24px; right: 24px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover::before { opacity: 1; }

  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.2s; }

  .card-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(200,240,74,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    font-size: 16px;
  }

  .card h3 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .card p {
    font-family: 'DM Serif Display', serif;
    font-size: 40px;
    font-weight: 400;
    color: var(--text);
    line-height: 1;
    letter-spacing: -1px;
  }

  /* Chart section */
  .chart-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    animation: fadeUp 0.5s 0.25s both;
  }

  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .chart-header h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--text);
  }

  .chart-badge {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(200,240,74,0.1);
    border: 1px solid rgba(200,240,74,0.2);
    border-radius: 100px;
    padding: 5px 12px;
  }

  canvas {
    max-height: 300px;
  }

  /* Footer */
  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: var(--muted);
    opacity: 0.6;
    letter-spacing: 0.05em;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .container { padding: 28px 20px; }
    h1 { font-size: 30px; }
    .cards { grid-template-columns: 1fr 1fr; gap: 12px; }
    .card p { font-size: 30px; }
    header { flex-direction: column; align-items: flex-start; gap: 16px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo-block">
      <div class="logo-label">Dashboard</div>
      <h1>Nuvant <em>Performance</em></h1>
    </div>
    <div class="status-pill" id="status">
      <span class="status-dot"></span>
      <span id="status-text">Sincronizando...</span>
    </div>
  </header>

  <div class="cards">
    <div class="card">
      <div class="card-icon">👥</div>
      <h3>Seguidores</h3>
      <p id="followers">—</p>
    </div>
    <div class="card">
      <div class="card-icon">🔁</div>
      <h3>Compartilhamentos</h3>
      <p id="shares">—</p>
    </div>
    <div class="card">
      <div class="card-icon">👁</div>
      <h3>Visualizações Perfil</h3>
      <p id="views">—</p>
    </div>
    <div class="card">
      <div class="card-icon">📡</div>
      <h3>Contas Alcançadas</h3>
      <p id="reach">—</p>
    </div>
  </div>

  <div class="chart-section">
    <div class="chart-header">
      <h3>Evolução das Visualizações de Perfil</h3>
      <span class="chart-badge">Ao vivo</span>
    </div>
    <canvas id="viewsChart"></canvas>
  </div>

  <footer>Atualização automática a cada 30 segundos &middot; Nuvant &copy; 2025</footer>
</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyN6Y6qy-5U1puyFlv8zWfEvmutxT-MA0sn-GLXgp2qKmuGboCwNVvh5nHdIfMKgzFGl5X-jNIliXp/pub?output=csv";
let data = [];
let chart;

function setStatus(text, type) {
  const pill = document.getElementById("status");
  const label = document.getElementById("status-text");
  label.innerText = text;
  pill.className = "status-pill " + (type || "");
}

async function fetchData() {
  try {
    setStatus("Sincronizando...", "");
    const response = await fetch(sheetURL);
    const text = await response.text();
    const rows = text.trim().split("\n").slice(1);
    data = rows.map(row => {
      const cols = row.split(",");
      return {
        views: +cols[4] || 0,
        followers: +cols[5] || 0,
        shares: +cols[2] || 0,
        reach: +cols[6] || 0
      };
    }).filter(d => Object.values(d).some(v => v !== 0));
    renderCards();
    renderChart();
    setStatus("Atualizado ✓", "ok");
  } catch (error) {
    console.error(error);
    setStatus("Erro de conexão", "err");
  }
}

function renderCards() {
  if (!data.length) return;
  const last = data[data.length - 1];
  document.getElementById("followers").innerText = last.followers.toLocaleString('pt-BR');
  document.getElementById("shares").innerText = last.shares.toLocaleString('pt-BR');
  document.getElementById("views").innerText = last.views.toLocaleString('pt-BR');
  document.getElementById("reach").innerText = last.reach.toLocaleString('pt-BR');
}

function renderChart() {
  const ctx = document.getElementById("viewsChart").getContext("2d");
  const labels = data.map((_, index) => `Dia ${index + 1}`);
  const values = data.map(d => d.views);
  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "Visualizações de Perfil",
        data: values,
        borderColor: "#c8f04a",
        backgroundColor: (context) => {
          const chart = context.chart;
          const { ctx: c, chartArea } = chart;
          if (!chartArea) return "transparent";
          const gradient = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
          gradient.addColorStop(0, "rgba(200,240,74,0.18)");
          gradient.addColorStop(1, "rgba(200,240,74,0)");
          return gradient;
        },
        borderWidth: 2.5,
        tension: 0.4,
        fill: true,
        pointBackgroundColor: "#c8f04a",
        pointBorderColor: "#0d0d0f",
        pointBorderWidth: 2,
        pointRadius: 4,
        pointHoverRadius: 7,
      }]
    },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#1e1e24",
          titleColor: "#7a7880",
          bodyColor: "#f0ede8",
          borderColor: "rgba(200,240,74,0.25)",
          borderWidth: 1,
          padding: 12,
          cornerRadius: 10,
          titleFont: { size: 11, weight: '600', family: 'DM Sans' },
          bodyFont: { size: 16, family: 'DM Serif Display' },
        }
      },
      scales: {
        x: {
          grid: { color: "rgba(255,255,255,0.04)" },
          ticks: { color: "#7a7880", font: { size: 12, family: 'DM Sans' } },
          border: { color: "rgba(255,255,255,0.06)" }
        },
        y: {
          beginAtZero: true,
          grid: { color: "rgba(255,255,255,0.04)" },
          ticks: { color: "#7a7880", font: { size: 12, family: 'DM Sans' } },
          border: { color: "rgba(255,255,255,0.06)" }
        }
      }
    }
  });
}

fetchData();
setInterval(fetchData, 30000);
</script>
</body>
</html>

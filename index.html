<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuvant Performance</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #e9e3dc;
  margin: 0;
  padding: 40px;
}

h1 {
  font-size: 38px;
  margin-bottom: 30px;
}

.cards {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  background: #fff;
  border-radius: 20px;
  padding: 25px;
  width: 250px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.card h3 {
  margin: 0;
  font-size: 16px;
  color: #777;
  font-weight: 600;
}

.card p {
  font-size: 32px;
  margin: 10px 0 0;
  font-weight: 700;
}

#status {
  position: absolute;
  top: 40px;
  right: 40px;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>Nuvant Performance</h1>
<div id="status">Sincronizando...</div>

<div class="cards">
  <div class="card">
    <h3>Seguidores</h3>
    <p id="followers">-</p>
  </div>

  <div class="card">
    <h3>Compartilhamentos</h3>
    <p id="shares">-</p>
  </div>

  <div class="card">
    <h3>Visualizações Perfil</h3>
    <p id="views">-</p>
  </div>

  <div class="card">
    <h3>Contas Alcançadas</h3>
    <p id="reach">-</p>
  </div>
</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyN6Y6qy-5U1puyFlv8zWfEvmutxT-MA0sn-GLXgp2qKmuGboCwNVvh5nHdIfMKgzFGl5X-jNIliXp/pub?output=csv";

let data = [];

function setStatus(text, error=false){
  const el = document.getElementById("status");
  if(!el) return;
  el.innerText = text;
  el.style.color = error ? "red" : "black";
}

async function fetchData(){
  try {
    setStatus("Sincronizando...");

    const res = await fetch(sheetURL);
    const text = await res.text();

    const rows = text.split("\n").slice(1);

    data = rows.map(r=>{
      const cols = r.split(",");

      return {
        date: cols[0],
        likes: +cols[1] || 0,
        saves: +cols[2] || 0,
        shares: +cols[3] || 0,
        comments: +cols[4] || 0,
        views: +cols[5] || 0,
        followers: +cols[6] || 0,
        reach: +cols[7] || 0
      };
    }).filter(d=>d.date);

    render();
    setStatus("Sincronizado ✓");

  } catch (error){
    console.error(error);
    setStatus("Erro na sincronização", true);
  }
}

function render() {
  if (!data.length) return;

  // pega última linha que tenha seguidores > 0
  const lastValid = [...data].reverse().find(d => d.followers > 0) || data[data.length - 1];

  document.getElementById("followers").innerText = lastValid.followers || 0;
  document.getElementById("shares").innerText = lastValid.shares || 0;
  document.getElementById("views").innerText = lastValid.views || 0;
  document.getElementById("reach").innerText = lastValid.reach || 0;
}

fetchData();
setInterval(fetchData, 60000);
</script>

</body>
</html>

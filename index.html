<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuvant Performance</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f7f3ee;
  margin:0;
  padding:40px;
  color:#1a1410;
}

h1{
  margin:0;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  margin-bottom:30px;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

.card h3{
  margin:0 0 10px 0;
  font-size:14px;
  color:#777;
}

.card span{
  font-size:28px;
  font-weight:bold;
}

.table-card{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
  margin-top:30px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

.highlight{
  background:#fff2eb;
  font-weight:bold;
}

.status{
  font-size:14px;
  color:#777;
}
</style>
</head>

<body>

<div class="header">
  <h1>Nuvant Performance</h1>
  <div class="status">🔄 Sincronizando...</div>
</div>

<div class="cards">
  <div class="card">
    <h3>Seguidores</h3>
    <span id="s-seg">-</span>
  </div>
  <div class="card">
    <h3>Compartilhamentos</h3>
    <span id="s-shares">-</span>
  </div>
  <div class="card">
    <h3>Visualizações Perfil</h3>
    <span id="s-views">-</span>
  </div>
  <div class="card">
    <h3>Contas Alcançadas</h3>
    <span id="s-reach">-</span>
  </div>
</div>

<div class="table-card">
  <canvas id="viewsChart" height="90"></canvas>
</div>

<div class="table-card">
  <table id="table"></table>
</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyN6Y6qy-5U1puyFlv8zWfEvmutxT-MA0sn-GLXgp2qKmuGboCwNVvh5nHdIfMKgzFGl5X-jNIliXp/pub?output=csv";

let data = [];
let chart;

async function fetchData(){
  try{
    const res = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(sheetURL));
    const text = await res.text();
    const rows = text.split("\n").slice(1);

    data = rows.map((r, index)=>{
      const cols = r.split(",");

      return {
        date: "Dia " + (index + 1),
        likes: Number(cols[0]) || 0,
        saves: Number(cols[1]) || 0,
        shares: Number(cols[2]) || 0,
        comments: Number(cols[3]) || 0,
        views: Number(cols[4]) || 0,
        followers: Number(cols[5]) || 0,
        reach: Number(cols[6]) || 0,
        clicks: Number(cols[7]) || 0
      };
    }).filter(d => d.views || d.shares || d.followers);

    render();

    document.querySelector(".status").innerHTML =
      "🟢 Atualizado às " + new Date().toLocaleTimeString();

  }catch(error){
    console.error(error);
    document.querySelector(".status").innerHTML =
      "❌ Erro na sincronização";
  }
}

function render(){
  if(!data.length) return;

  const last = data[data.length-1];

  const totalShares = data.reduce((s,d)=>s+d.shares,0);
  const totalViews = data.reduce((s,d)=>s+d.views,0);

  document.getElementById("s-seg").innerHTML =
    last.followers + growthHTML();

  document.getElementById("s-shares").textContent = totalShares;
  document.getElementById("s-views").textContent = totalViews;
  document.getElementById("s-reach").textContent = last.reach;

  const bestDay = data.reduce((max,d)=> d.views>max.views?d:max, data[0]);

  renderChart();
  renderTable(bestDay);
}

function growthHTML(){
  if(data.length < 2) return "";

  const first = data[0].followers;
  const last = data[data.length-1].followers;

  if(first === 0) return "";

  const growth = ((last - first) / first * 100).toFixed(1);

  return `<div style="font-size:12px;color:#c84b2f;margin-top:6px">
            +${growth}% crescimento
          </div>`;
}

function renderChart(){
  const ctx = document.getElementById("viewsChart");

  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    type:"line",
    data:{
      labels:data.map(d=>d.date),
      datasets:[{
        label:"Visualizações de Perfil",
        data:data.map(d=>d.views),
        borderColor:"#c84b2f",
        backgroundColor:"rgba(200,75,47,0.1)",
        fill:true,
        tension:0.3
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true}}
    }
  });
}

function renderTable(bestDay){
  const table = document.getElementById("table");

  table.innerHTML = `
    <tr>
      <th>Dia</th>
      <th>Compart.</th>
      <th>Visualizações</th>
    </tr>
  `;

  data.forEach(d=>{
    const highlight = d.views === bestDay.views ? "highlight" : "";

    table.innerHTML += `
      <tr class="${highlight}">
        <td>${d.date}</td>
        <td>${d.shares}</td>
        <td>${d.views}</td>
      </tr>
    `;
  });
}

fetchData();
setInterval(fetchData, 60000);
</script>

</body>
</html>

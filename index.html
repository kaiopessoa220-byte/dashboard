<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuvant Performance</title>

<!-- Remove erro de favicon -->
<link rel="icon" href="data:,">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #dcd6cf;
}

.container {
  padding: 40px;
}

h1 {
  margin-bottom: 40px;
}

.cards {
  display: flex;
  gap: 25px;
  flex-wrap: wrap;
}

.card {
  background: #f3f3f3;
  padding: 25px;
  border-radius: 20px;
  width: 220px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.card h3 {
  margin: 0;
  font-size: 16px;
  color: #555;
}

.card p {
  font-size: 32px;
  margin: 10px 0 0;
  font-weight: bold;
}

.status {
  position: absolute;
  top: 20px;
  right: 40px;
  font-size: 14px;
}
</style>
</head>
<body>

<div class="status" id="status">Sincronizando...</div>

<div class="container">
  <h1>Nuvant Performance</h1>

  <div class="cards">
    <div class="card">
      <h3>Seguidores</h3>
      <p id="followers">-</p>
    </div>

    <div class="card">
      <h3>Compartilhamentos</h3>
      <p id="shares">-</p>
    </div>

    <div class="card">
      <h3>Visualizações Perfil</h3>
      <p id="views">-</p>
    </div>

    <div class="card">
      <h3>Contas Alcançadas</h3>
      <p id="reach">-</p>
    </div>
  </div>
</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyN6Y6qy-5U1puyFlv8zWfEvmutxT-MA0sn-GLXgp2qKmuGboCwNVvh5nHdIfMKgzFGl5X-jNIliXp/pub?output=csv";

let data = [];

function setStatus(text) {
  const el = document.getElementById("status");
  if (el) el.innerText = text;
}

async function fetchData() {
  try {
    setStatus("Sincronizando...");

    const response = await fetch(sheetURL);
    const text = await response.text();

    const rows = text.trim().split("\n").slice(1);

    data = rows.map(row => {
      const cols = row.split(",");

      return {
        likes: +cols[0] || 0,
        saves: +cols[1] || 0,
        shares: +cols[2] || 0,
        comments: +cols[3] || 0,
        views: +cols[4] || 0,
        followers: +cols[5] || 0,
        reach: +cols[6] || 0,
        clicks: +cols[7] || 0
      };
    }).filter(d => Object.values(d).some(v => v !== 0));

    render();
    setStatus("Atualizado ✅");

  } catch (error) {
    console.error(error);
    setStatus("Erro na sincronização ❌");
  }
}

function render() {
  if (!data.length) return;

  const last = data[data.length - 1];

  document.getElementById("followers").innerText = last.followers;
  document.getElementById("shares").innerText = last.shares;
  document.getElementById("views").innerText = last.views;
  document.getElementById("reach").innerText = last.reach;
}

fetchData();

// Atualiza automaticamente a cada 30 segundos
setInterval(fetchData, 30000);
</script>

</body>
</html>

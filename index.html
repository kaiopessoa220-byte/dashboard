<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Nuvant Performance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#d6d2cc;
  margin:0;
  padding:40px;
}

h1{
  margin-bottom:30px;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.status{
  font-size:14px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px;
  margin-bottom:40px;
}

.card{
  background:#e5e5e5;
  padding:25px;
  border-radius:20px;
}

.card h3{
  margin:0 0 15px 0;
  font-size:16px;
  color:#666;
}

.card p{
  margin:0;
  font-size:28px;
  font-weight:bold;
}

.box{
  background:#e5e5e5;
  padding:40px;
  border-radius:20px;
  margin-bottom:40px;
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>Nuvant Performance</h1>
  <div id="sync-status" class="status">🔄 Sincronizando...</div>
</div>

<div class="cards">
  <div class="card">
    <h3>Seguidores</h3>
    <p id="followers">-</p>
  </div>

  <div class="card">
    <h3>Compartilhamentos</h3>
    <p id="shares">-</p>
  </div>

  <div class="card">
    <h3>Visualizações Perfil</h3>
    <p id="views">-</p>
  </div>

  <div class="card">
    <h3>Contas Alcançadas</h3>
    <p id="reach">-</p>
  </div>
</div>

<div class="box">
  <canvas id="chart"></canvas>
</div>

<script>

const sheetID = "2PACX-1vRyN6Y6qy-5U1puyFlv8zWfEvmutxT-MA0sn-GLXgp2qKmuGboCwNVvh5nHdIfMKgzFGl5X-jNIliXp";
const sheetURL = `https://docs.google.com/spreadsheets/d/e/${sheetID}/gviz/tq?tqx=out:json`;

let chart;

async function fetchData(){
  try{
    document.getElementById("sync-status").innerHTML="🔄 Sincronizando...";

    const res = await fetch(sheetURL);
    const text = await res.text();

    const json = JSON.parse(text.substring(47).slice(0, -2));
    const rows = json.table.rows;

    const data = rows.map(r=>({
      likes: r.c[0]?.v || 0,
      saves: r.c[1]?.v || 0,
      shares: r.c[2]?.v || 0,
      comments: r.c[3]?.v || 0,
      views: r.c[4]?.v || 0,
      followers: r.c[5]?.v || 0,
      reach: r.c[6]?.v || 0,
      clicks: r.c[7]?.v || 0
    }));

    const last = data[data.length-1];

    document.getElementById("followers").innerText = last.followers;
    document.getElementById("shares").innerText = last.shares;
    document.getElementById("views").innerText = last.views;
    document.getElementById("reach").innerText = last.reach;

    renderChart(data);

    document.getElementById("sync-status").innerHTML="🟢 Atualizado";

  }catch(e){
    document.getElementById("sync-status").innerHTML="❌ Erro na sincronização";
    console.error(e);
  }
}

function renderChart(data){
  const labels = data.map((_,i)=>"Dia "+(i+1));
  const followers = data.map(d=>d.followers);

  if(chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels:labels,
      datasets:[{
        label:"Seguidores",
        data:followers,
        tension:0.3
      }]
    }
  });
}

fetchData();
setInterval(fetchData,120000);

</script>

</body>
</html>

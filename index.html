<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuvant Performance · Analytics</title>

<style>
:root {
  --bg: #f7f3ee;
  --surface: #ffffff;
  --surface2: #f0ebe3;
  --dark: #1a1410;
  --accent: #c84b2f;
  --accent2: #e8922a;
  --accent3: #2a7a4b;
  --text: #1a1410;
  --muted: #9a8f85;
  --border: #e6dfd6;
}

* { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 40px 20px;
}

header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.brand { display:flex; align-items:center; gap:16px; }
.logo { width:52px; height:52px; background:var(--dark); border-radius:14px; display:flex; justify-content:center; align-items:center; font-size:22px; color:white; }
.brand-name { font-size:22px; font-weight:800; }
.brand-sub { font-size:12px; color:var(--muted); }
.header-actions { display:flex; gap:10px; align-items:center; }

.sync-status {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  border-radius:10px;
  border:1.5px solid var(--border);
  font-size:12px;
  color:var(--muted);
  background:var(--surface);
}

.sync-dot { width:8px; height:8px; border-radius:50%; background:var(--accent3); }
.sync-dot.syncing { background: var(--accent2); }
.sync-dot.error { background: var(--accent); }

.btn { padding:10px 20px; border-radius:10px; font-size:13px; cursor:pointer; border:none; transition:0.2s; }
.btn-outline { background:transparent; border:1.5px solid var(--border); color:var(--muted); }
.btn-dark { background:var(--dark); color:white; }

.summary {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap:20px;
  margin-bottom:40px;
}

.sum-card {
  background:var(--surface); padding:20px;
  border-radius:16px;
  border:1px solid var(--border);
}

.sum-label { font-size:13px; color:var(--muted); }
.sum-value { font-size:26px; font-weight:700; margin-top:6px; }

.table-card {
  background:var(--surface);
  border-radius:16px;
  padding:20px;
  border:1px solid var(--border);
  overflow:auto;
}

table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:10px; border-bottom:1px solid var(--border); text-align:left; }

.toast {
  position:fixed;
  bottom:20px; right:20px;
  background:var(--dark);
  color:white;
  padding:12px 18px;
  border-radius:12px;
  opacity:0; transform:translateY(10px);
  transition:0.3s;
}

.toast.show {
  opacity:1; transform:translateY(0);
}
</style>
</head>
<body>

<div class="container">

<header>
  <div class="brand">
    <div class="logo">📊</div>
    <div>
      <div class="brand-name">Nuvant Performance</div>
      <div class="brand-sub">@nuvantperformance · Analytics do Perfil</div>
    </div>
  </div>

  <div class="header-actions">
    <div class="sync-status">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-text">Sincronizando…</span>
    </div>
    <button class="btn btn-outline" onclick="exportCSV()">⬇ Exportar</button>
  </div>
</header>

<div class="summary">
  <div class="sum-card"><div class="sum-label">Seguidores</div><div class="sum-value" id="s-seg">—</div></div>
  <div class="sum-card"><div class="sum-label">Contas Alcançadas</div><div class="sum-value" id="s-reach">—</div></div>
  <div class="sum-card"><div class="sum-label">Likes</div><div class="sum-value" id="s-likes">—</div></div>
  <div class="sum-card"><div class="sum-label">Salvamentos</div><div class="sum-value" id="s-saves">—</div></div>
</div>

<div class="table-card">
  <table id="table"></table>
</div>

</div>

<div class="toast" id="toast"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyN6Y6qy-5U1puyFlv8zWfEvmutxT-MA0sn-GLXgp2qKmuGboCwNVvh5nHdIfMKgzFGl5X-jNIliXp/pub?output=csv";
const AUTO_REFRESH_MS = 60000;

let lastFingerprint = "";
let data = [];

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),3000);
}

function updateSync(text,state="ok"){
  const dot=document.getElementById("sync-dot");
  const label=document.getElementById("sync-text");
  dot.classList.remove("syncing","error");
  if(state==="syncing") dot.classList.add("syncing");
  if(state==="error") dot.classList.add("error");
  label.textContent=text;
}

async function fetchCSV(){
  updateSync("Sincronizando…","syncing");
  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const fingerprint = text.trim();

    if(fingerprint !== lastFingerprint){
      lastFingerprint = fingerprint;
      parseCSV(text);
      showToast("✅ Dados atualizados da planilha!");
    }

    updateSync("Atualizado às "+ 
      new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));

  }catch(e){
    updateSync("Erro na sincronização","error");
  }
}

function parseCSV(text){
  const rows = text.split("\n").slice(1); // remove header
  data = [];

  rows.forEach((r,index)=>{
    const c = r.split(",");
    if(c.length < 8) return;

    data.push({
      date: "Dia " + (index + 1),
      likes: +c[0] || 0,
      saves: +c[1] || 0,
      shares: +c[2] || 0,
      comments: +c[3] || 0,
      views: +c[4] || 0,
      followers: +c[5] || 0,
      reach: +c[6] || 0,
      clicks: +c[7] || 0
    });
  });

  render();
}

function render(){
  if(!data.length) return;

  const last = data[data.length-1];
  const total = k => data.reduce((s,d)=>s+d[k],0);

  document.getElementById("s-seg").textContent = last.followers;
  document.getElementById("s-reach").textContent = total("reach");
  document.getElementById("s-likes").textContent = total("likes");
  document.getElementById("s-saves").textContent = total("saves");

  const table = document.getElementById("table");
  table.innerHTML = "<tr><th>Dia</th><th>Likes</th><th>Salv.</th><th>Seg.</th></tr>";

  data.forEach(d=>{
    table.innerHTML += `<tr>
      <td>${d.date}</td>
      <td>${d.likes}</td>
      <td>${d.saves}</td>
      <td>${d.followers}</td>
    </tr>`;
  });
}

function exportCSV(){
  const blob = new Blob([lastFingerprint], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "dados.csv";
  a.click();
}

window.addEventListener("load",()=>{
  fetchCSV();
  setInterval(fetchCSV,AUTO_REFRESH_MS);
});
</script>

</body>
</html>
